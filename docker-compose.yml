version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_workbench
    command: ["postgres", "-p", "${DB_PORT:-25432}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT:-25432} -U postgres -d agent_workbench"]
      interval: 3s
      timeout: 3s
      retries: 10

  fixture:
    build:
      context: ./backend
      dockerfile: Dockerfile.fixture
    restart: unless-stopped
    network_mode: host
    environment:
      FIXTURE_PORT: '${FIXTURE_PORT:-29090}'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    environment:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${DB_PORT:-25432}/agent_workbench?sslmode=disable
      PORT: '${BACKEND_PORT:-28080}'
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-23000},http://127.0.0.1:${FRONTEND_PORT:-23000}
      MIGRATIONS_PATH: /app/migrations
      FIXTURE_PORT: '${FIXTURE_PORT:-29090}'
      LLM_API_FORMAT: '${LLM_API_FORMAT:-chat_completions}'
      LLM_API_KEY: '${LLM_API_KEY:-}'
      LLM_BASE_URL: '${LLM_BASE_URL:-}'
      LLM_MODEL: '${LLM_MODEL:-}'
      LLM_MAX_INFLIGHT: '${LLM_MAX_INFLIGHT:-2}'
      LLM_MAX_OUTPUT_TOKENS: '${LLM_MAX_OUTPUT_TOKENS:-4096}'
      LLM_MODEL_RECOVERY_ATTEMPTS: '${LLM_MODEL_RECOVERY_ATTEMPTS:-3}'
      OMA_BROKER_URL: http://127.0.0.1:${OMA_BROKER_PORT:-28184}
      OMA_BROKER_TOKEN: '${OMA_BROKER_TOKEN:?Run python3 scripts/prepare-runtime.py first}'
      OMA_WORKSPACE_ROOT: '${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}'
      OMA_CAPTURE_LISTEN: '127.0.0.1:${OMA_CAPTURE_PORT:-28183}'
      # Keep the workspace path identical on the host, API and broker.
      # This service must not mount the Docker socket.
    volumes:
      - ${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}:${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      fixture:
        condition: service_started
      execution-broker:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: host
    environment:
      PORT: '${FRONTEND_PORT:-23000}'
      HOSTNAME: '0.0.0.0'
      INTERNAL_API_URL: http://127.0.0.1:${BACKEND_PORT:-28080}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-28080}
    depends_on:
      backend:
        condition: service_healthy

  # Merged from deploy/execution/compose.fragment.yml.
  # The broker is the only service that mounts the Docker socket.
  execution-broker:
    build:
      context: ./backend
      dockerfile: ../deploy/execution/broker.Dockerfile
    command: ["--listen", "0.0.0.0:28184", "--workspace-root", "${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}"]
    healthcheck:
      test: ["CMD", "/oma-broker", "--healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    environment:
      OMA_BROKER_TOKEN: '${OMA_BROKER_TOKEN:?Run python3 scripts/prepare-runtime.py first}'
    ports:
      - "127.0.0.1:${OMA_BROKER_PORT:-28184}:28184"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution-broker-state:/var/lib/oma/broker
      - ${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}:${OMA_WORKSPACE_ROOT:-/tmp/oma-workspaces}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    user: "0:0"
    networks: [execution_broker]

volumes:
  pgdata:
  execution-broker-state:

networks:
  execution_broker:
    internal: false
